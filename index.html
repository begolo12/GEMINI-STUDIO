<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Financial Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      /* Print specific styles for A4 Report */
      @media print {
        @page {
          margin: 10mm;
          size: A4 portrait;
        }
        
        body {
          background-color: white;
          font-size: 12px; /* Slightly smaller base font for density */
        }

        #root {
          width: 100%;
          max-width: none;
          padding: 0;
          margin: 0;
        }

        .no-print {
          display: none !important;
        }

        /* Essential for full table printing */
        .print-overflow-visible {
          overflow: visible !important;
          height: auto !important;
        }

        /* Avoid breaking elements across pages */
        .print-break-inside-avoid {
          break-inside: avoid;
          page-break-inside: avoid;
        }

        /* Force page breaks where necessary */
        .print-break-before {
          break-before: page;
          page-break-before: always;
        }

        /* Clean up card styling for paper */
        .print-shadow-none {
          box-shadow: none !important;
          border: 1px solid #cbd5e1 !important; /* Slightly darker border for crispness */
        }

        /* Ensure text contrast */
        h1, h2, h3, h4, p, span, div {
          color: #0f172a !important; /* Slate-900 */
        }
        
        /* Keep meaningful colors for indicators */
        .text-emerald-600, .text-rose-600, .text-blue-600 {
           -webkit-print-color-adjust: exact !important;
           print-color-adjust: exact !important;
        }
      }
    </style>
